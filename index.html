<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bosque · Patrón Flyweight</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #11161c;
        color: #e6edf3;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px 24px;
        border-bottom: 1px solid #263040;
      }
      h1 { margin: 0; font-size: 1.3rem; }
      h2 { margin: 24px 0 8px; font-size: 1rem; color: #9fb3c8; }
      .badge {
        padding: 4px 10px;
        border-radius: 999px;
        background: #5c2230;
        color: #ffb3c1;
        font-size: 0.8rem;
      }
      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 24px;
        padding: 24px;
        max-width: 1200px;
        margin: 0 auto;
      }
      @media (max-width: 860px) {
        main { grid-template-columns: 1fr; }
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 1 / 1;
        max-width: 820px;
        border-radius: 8px;
        border: 1px solid #263040;
      }
      .legend { display: flex; gap: 16px; margin-top: 12px; font-size: 0.85rem; flex-wrap: wrap; }
      .legend span { display: inline-flex; align-items: center; gap: 6px; }
      .legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
      .panel { background: #18202a; border: 1px solid #263040; border-radius: 8px; padding: 16px 20px; align-self: start; }
      .panel h2:first-child { margin-top: 0; }
      input[type="range"] { width: 100%; }
      .row { display: flex; gap: 8px; margin-top: 10px; }
      button {
        flex: 1;
        padding: 8px 10px;
        border: 0;
        border-radius: 6px;
        background: #2f81f7;
        color: white;
        font-weight: 600;
        cursor: pointer;
      }
      button.secondary { background: #3a4656; }
      button.preset { background: #26405f; font-weight: 500; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .progress { margin-top: 12px; }
      .progress[hidden] { display: none; }
      .track { height: 8px; background: #263040; border-radius: 4px; overflow: hidden; }
      #progress-bar { height: 100%; width: 0%; background: #2f81f7; }
      #progress-text { font-size: 0.8rem; color: #9fb3c8; }
      dl { margin: 0; display: grid; grid-template-columns: 1fr auto; row-gap: 6px; font-size: 0.9rem; }
      dt { color: #9fb3c8; }
      dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
      #warning { min-height: 1.2em; margin: 12px 0 0; font-size: 0.85rem; color: #ffb86b; }
    </style>
  </head>
  <body>
    <header>
      <h1>🌲 Bosque Flyweight</h1>
      <span class="badge">Modo: sin Flyweight (deuda técnica)</span>
    </header>

    <main>
      <section>
        <canvas id="forest-canvas"></canvas>
        <div class="legend" id="legend"></div>
      </section>

      <aside class="panel">
        <h2>Controles</h2>
        <label for="amount-slider">
          Cantidad a plantar: <strong id="amount-label">500</strong>
        </label>
        <input type="range" id="amount-slider" min="100" max="5000" step="100" value="500" />
        <div class="row">
          <button id="plant-btn">Plantar</button>
          <button id="clear-btn" class="secondary">Vaciar</button>
        </div>
        <div class="row">
          <button class="preset" data-amount="100">+100</button>
          <button class="preset" data-amount="500">+500</button>
          <button class="preset" data-amount="1000">+1000</button>
        </div>

        <div class="progress" id="progress" hidden>
          <div class="track"><div id="progress-bar"></div></div>
          <span id="progress-text"></span>
        </div>

        <h2>Métricas</h2>
        <dl>
          <dt>Árboles</dt><dd id="m-trees">0</dd>
          <dt>Conjuntos mesh+texture</dt><dd id="m-resources">0</dd>
          <dt>Buffers creados</dt><dd id="m-buffers">0</dd>
          <dt>Memoria en buffers</dt><dd id="m-memory">0 MB</dd>
          <dt>Tiempo de creación</dt><dd id="m-time">0 ms</dd>
          <dt>FPS</dt><dd id="m-fps">0</dd>
        </dl>
        <p id="warning"></p>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
